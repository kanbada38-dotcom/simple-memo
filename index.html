<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메모장</title>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#222;font:16px system-ui,sans-serif}main{max-width:560px;margin:32px auto;padding:16px}section,li{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}h1{font-size:24px}input,textarea,button{font:inherit;max-width:100%}input,textarea{display:block;width:100%;padding:10px;margin:8px 0 16px;border:1px solid #aaa;border-radius:4px}textarea{min-height:120px;resize:vertical}button{padding:9px 16px;cursor:pointer;background:#f4f4f4;border:1px solid #aaa;border-radius:4px}button:disabled{opacity:.5;cursor:wait}ul{padding:0;list-style:none}p{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:24px;color:#555}[hidden]{display:none!important}
</style>
<main>
<h1>메모장</h1>
<section id="auth" hidden>
<form id="login">
<label for="email">이메일</label><input id="email" type="email" autocomplete="username" required>
<label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="6" required>
<button type="submit">로그인</button> <button id="signup" type="button">회원가입</button>
</form>
</section>
<section id="app" hidden>
<button id="logout">로그아웃</button>
<form id="memo"><label for="content">메모 내용</label><textarea id="content" required></textarea><button type="submit">저장</button></form>
<ul id="list" aria-label="내 메모"></ul>
</section>
<p id="status" role="status">불러오는 중…</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
<script>
const $=id=>document.getElementById(id);
let db,user=null,generation=0;
function status(text){$('status').textContent=text}
function errorText(e){return '오류: '+(e.message||'다시 시도해 주세요.')}
async function run(fn){
 document.querySelectorAll('button').forEach(b=>b.disabled=true);
 status('처리 중…');
 try{await fn()}catch(e){status(errorText(e))}
 finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}
}
async function list(){
 const ticket=++generation,uid=user.id;
 const {data,error}=await db.from('memos').select('id,content,created_at').order('created_at',{ascending:false});
 if(error)throw error;
 if(ticket!==generation||user?.id!==uid)return;
 $('list').replaceChildren();
 for(const m of data){
 const li=document.createElement('li'),p=document.createElement('p'),b=document.createElement('button');
 p.textContent=m.content;b.textContent='삭제';
 b.onclick=()=>run(async()=>{
 const {error}=await db.from('memos').delete().eq('id',m.id);
 if(error)throw error;await list();status('삭제했어요.');
 });
 li.append(p,b);$('list').append(li);
 }
}
async function render(session){
 user=session?.user||null;generation++;
 $('auth').hidden=!!user;$('app').hidden=!user;$('list').replaceChildren();
 if(user){await list();status('')}else status('');
}
async function auth(signup){
 if(!$('login').reportValidity())return;
 await run(async()=>{
 const credentials={email:$('email').value.trim(),password:$('password').value};
 const {data,error}=signup?await db.auth.signUp(credentials):await db.auth.signInWithPassword(credentials);
 if(error)throw error;
 $('password').value='';
 if(!data.session)throw Error('이메일 확인 설정으로 자동 로그인하지 못했어요.');
 await render(data.session);
 });
}
$('login').onsubmit=e=>{e.preventDefault();auth(false)};
$('signup').onclick=()=>auth(true);
$('logout').onclick=()=>run(async()=>{const {error}=await db.auth.signOut();if(error)throw error;$('content').value='';await render(null)});
$('memo').onsubmit=e=>{e.preventDefault();const content=$('content').value.trim();if(!content){status('메모를 입력해 주세요.');return}
run(async()=>{status('저장 중…');const {error}=await db.from('memos').insert({user_id:user.id,content});if(error)throw error;$('content').value='';await list();status('저장했어요.')})};
(async()=>{
try{
 if(!window.supabase)throw Error('라이브러리를 불러오지 못했어요. 새로고침해 주세요.');
 db=supabase.createClient('https://lcnelusmqhcdklxajcsv.supabase.co','sb_publishable_nJg6jNbJL0DAb135uYQJgg_sy0sIUJq',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'simple-memo-auth'}});
 db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')void render(null)});
 const {data,error}=await db.auth.getSession();if(error)throw error;await render(data.session);
}catch(e){status(errorText(e))}
})();
</script>
</html>
